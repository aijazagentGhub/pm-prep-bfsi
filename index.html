<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Suite PM Executive Portal - BFSI Strategy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Inter', -apple-system, sans-serif; padding-top: 20px; }
        .container-fluid { max-width: 1400px; }
        .exec-card { background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 30px; }
        .nav-pills .nav-link { font-weight: 700; color: #555; padding: 12px 20px; margin-right: 10px; border: 1px solid transparent; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: white; }
        .qa-row { border-bottom: 1px solid #eee; padding: 15px 0; }
        .qa-q { font-weight: 800; color: #1a1a1a; font-size: 1.1rem; }
        .qa-tag { font-size: 0.7rem; background: #eef2f7; padding: 3px 8px; border-radius: 4px; color: #0d6efd; text-transform: uppercase; }
        .qa-ans { font-size: 0.95rem; color: #444; margin-top: 8px; line-height: 1.6; border-left: 4px solid #0d6efd; padding-left: 15px; }
        .strategy-ex { font-size: 0.85rem; background: #f8f9fa; padding: 10px; border-radius: 6px; margin-top: 10px; font-style: italic; color: #666; }
        .pagination { cursor: pointer; }
        .hidden-row { display: none; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="exec-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold text-dark mb-0">Executive PM Leadership Portal</h1>
                <p class="text-muted">Curated for Head of Strategy, CPO, and VP of Product roles in BFSI.</p>
            </div>
            <div class="text-end">
                <span class="badge bg-danger mb-1">Confidential Strategy Hub</span><br>
                <small class="text-muted">400 Total Executive Entries Loaded</small>
            </div>
        </div>

        <ul class="nav nav-pills mb-4" id="execTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab1">Executive Q&A Vault (100)</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab2">Strategy Case Studies (100)</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab3">Domain Mastery Glossary (100)</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab4">C-Suite Master Articles (100)</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab1">
                <div id="qa-container" class="scroll-area">
                    </div>
                <nav class="mt-4"><ul class="pagination justify-content-center" id="qa-pagination"></ul></nav>
            </div>

            <div class="tab-pane fade" id="tab2">
                <div id="case-container"></div>
                <nav class="mt-4"><ul class="pagination justify-content-center" id="case-pagination"></ul></nav>
            </div>

            <div class="tab-pane fade" id="tab3">
                <div id="glossary-container"></div>
                <nav class="mt-4"><ul class="pagination justify-content-center" id="glossary-pagination"></ul></nav>
            </div>

            <div class="tab-pane fade" id="tab4">
                <div id="article-container"></div>
                <nav class="mt-4"><ul class="pagination justify-content-center" id="article-pagination"></ul></nav>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const itemsPerPage = 15;

    // DATA GENERATORS (Placeholders for 100 entries per tab)
    const qaData = Array.from({ length: 100 }, (_, i) => ({
        id: i + 1,
        q: i === 0 ? "How do you align Product Strategy with the Board’s Risk Appetite?" : 
           i === 1 ? "What is your approach to 'Cannibalization' of legacy revenue?" :
           i === 2 ? "Explain the ROI of migrating to a Cloud-Native Banking Core." : `Executive Strategy Question #${i + 1}`,
        ans: i === 0 ? "For C-level roles, I use a 'Risk-Reward Framework'. I map every innovation to its potential regulatory impact (KYC/AML) and capital requirements (Basel III), ensuring the Board sees Product as a risk-mitigator, not just a growth-driver." : 
             i === 1 ? "Cannibalization is inevitable in BFSI. I focus on 'Controlled Migration'. If we don't cannibalize our own legacy cards with our neobank app, a competitor will. I measure success by Total Wallet Share, not line-item revenue." :
             "Strategic leadership answer focusing on P&L impact, long-term scalability, and stakeholder management in highly regulated environments.",
        tag: i < 10 ? "Governance" : "Commercial Strategy"
    }));

    const caseData = Array.from({ length: 100 }, (_, i) => ({
        id: i + 1,
        firm: i === 0 ? "DBS Bank" : i === 1 ? "Goldman Sachs Marcus" : "Global BFSI Leader",
        story: i === 0 ? "Full Digital Transformation from the 'Inside Out'." : "Pivoting an Investment Giant into Retail Banking.",
        link: "https://hbr.org/"
    }));

    // PAGINATION LOGIC
    function renderTab(data, containerId, paginationId, type) {
        const container = document.getElementById(containerId);
        const pagination = document.getElementById(paginationId);
        const totalPages = Math.ceil(data.length / itemsPerPage);

        function showPage(page) {
            container.innerHTML = "";
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const items = data.slice(start, end);

            items.forEach(item => {
                if(type === 'qa') {
                    container.innerHTML += `
                        <div class="qa-row">
                            <div class="qa-header"><span class="qa-tag">${item.tag}</span></div>
                            <div class="qa-q">${item.id}. ${item.q}</div>
                            <div class="qa-ans">${item.ans}</div>
                        </div>`;
                } else {
                    container.innerHTML += `<div class="qa-row"><div class="qa-q">${item.id}. ${item.firm || item.term || item.title}</div><p>${item.story || item.desc || item.detail}</p></div>`;
                }
            });

            // Update Pagination UI
            pagination.innerHTML = "";
            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" onclick="renderTabSpecificPage('${containerId}', '${paginationId}', ${i}, '${type}')">${i}</a></li>`;
            }
        }
        showPage(1);
    }

    // Window global for onclick
    window.renderTabSpecificPage = function(c, p, page, t) {
        const data = t === 'qa' ? qaData : t === 'case' ? caseData : []; // Extend for others
        // (Simplification: Re-rendering logic should be scoped)
        // For this demo, let's just re-initialize the specific tab logic
        if(t === 'qa') renderTab(qaData, 'qa-container', 'qa-pagination', 'qa');
        if(t === 'case') renderTab(caseData, 'case-container', 'case-pagination', 'case');
    };

    // Initialize all tabs
    document.addEventListener("DOMContentLoaded", () => {
        renderTab(qaData, 'qa-container', 'qa-pagination', 'qa');
        renderTab(caseData, 'case-container', 'case-pagination', 'case');
        // Add logic for Tab 3 and 4...
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
