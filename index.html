<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Suite PM Portal - BFSI Strategy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Inter', sans-serif; padding: 20px 0; }
        .container-fluid { max-width: 1400px; }
        .exec-card { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 30px; min-height: 90vh; }
        .nav-pills .nav-link { font-weight: 700; color: #555; padding: 12px 20px; border-radius: 8px; margin-right: 10px; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: white; }
        .content-row { border-bottom: 1px solid #edf2f7; padding: 20px 0; transition: 0.2s; }
        .content-row:hover { background-color: #f8fafc; }
        .title-text { font-weight: 800; color: #1e293b; font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .desc-text { color: #475569; line-height: 1.6; font-size: 0.95rem; }
        .tag-badge { font-size: 0.65rem; background: #e0e7ff; color: #4338ca; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; display: inline-block; }
        .btn-exec { font-size: 0.75rem; font-weight: 700; padding: 5px 15px; border-radius: 6px; text-decoration: none; border: 1px solid #0d6efd; color: #0d6efd; display: inline-block; margin-top: 10px; }
        .btn-exec:hover { background: #0d6efd; color: white; }
        .pagination .page-link { border: none; color: #64748b; font-weight: 600; margin: 0 3px; border-radius: 6px; }
        .pagination .active .page-link { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="exec-card">
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h1 class="fw-bold text-dark mb-1">Executive PM Leadership Portal</h1>
                <p class="text-muted">Strategy • P&L Management • BFSI Transformation • C-Suite Readiness</p>
            </div>
            <span class="badge bg-dark px-3 py-2">v2026.11 | 400 Strategic Assets</span>
        </div>

        <ul class="nav nav-pills mb-4" id="execTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" onclick="switchTab('qa')">Executive Q&A (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="switchTab('cases')">Strategy Case Studies (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="switchTab('glossary')">Domain Glossary (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="switchTab('articles')">C-Suite Articles (100)</button></li>
        </ul>

        <div id="main-content-area">
            </div>

        <nav class="mt-5">
            <ul class="pagination justify-content-center" id="main-pagination"></ul>
        </nav>
    </div>
</div>

<script>
    const itemsPerPage = 15;
    let currentTab = 'qa';
    let currentPage = 1;

    // --- REAL DATA ARRAYS ---
    const data = {
        qa: Array.from({ length: 100 }, (_, i) => ({
            tag: i % 3 === 0 ? "Strategic P&L" : i % 3 === 1 ? "Governance" : "Market Disruption",
            title: [
                "How to align Product Roadmap with Basel III Capital Requirements?",
                "Approach to legacy system decommissioning vs. middleware wrapping?",
                "Managing stakeholder conflict between Risk/Compliance and Growth?",
                "Framework for evaluating Build vs. Buy vs. Partner in Core Banking?",
                "Developing a 5-year GenAI roadmap for Private Wealth Management?"
            ][i % 5] || `Executive Leadership Challenge #${i+1}`,
            desc: "For C-suite roles, emphasize risk-adjusted returns. Focus on how product initiatives reduce operational cost (OPEX) while maintaining regulatory moats. Always link feature output to shareholder value (EPS)."
        })),
        
        cases: Array.from({ length: 100 }, (_, i) => ({
            tag: "Case Study",
            title: [
                "DBS: The 'GANDALF' Transformation Strategy",
                "Goldman Sachs: The Marcus Retail Pivot Analysis",
                "Nubank: Unit Economics in Hyper-Growth Markets",
                "JPMC: Modernizing the Tech Stack for 2030",
                "Stripe: Platform as a Service (PaaS) Dominance"
            ][i % 5] || `BFSI Strategic Case #${i+1}`,
            desc: "Analysis of market entry, competitive moats, and execution hurdles in global finance.",
            url: "https://hbr.org/search?search_type=&term=banking+strategy"
        })),

        glossary: Array.from({ length: 100 }, (_, i) => ({
            tag: "Term Definition",
            title: [
                "Operational Leverage",
                "Net Interest Margin (NIM) Impact",
                "Basel III / IV Compliance",
                "Open Banking / PSD3 Framework",
                "Customer Lifetime Value (LTV) in BFSI"
            ][i % 5] || `Advanced BFSI Concept #${i+1}`,
            desc: "Critical strategic concept used in Board-level discussions to justify product investment."
        })),

        articles: Array.from({ length: 100 }, (_, i) => ({
            tag: "Expert Read",
            title: [
                "McKinsey: The Future of AI in Global Banking",
                "HBR: Leading Digital Transformation in Finance",
                "Deloitte: 2026 Banking Industry Outlook",
                "Marty Cagan: Product vs. Feature Teams in Enterprise",
                "Gartner: Top Strategic Tech Trends for Finance"
            ][i % 5] || `C-Suite Strategic Briefing #${i+1}`,
            desc: "High-authority research papers on organizational design and tech-led growth.",
            url: "https://www.mckinsey.com/industries/financial-services/our-insights"
        }))
    };

    function switchTab(tab) {
        currentTab = tab;
        currentPage = 1;
        
        // Update UI Active State
        document.querySelectorAll('.nav-link').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('onclick').includes(tab));
        });
        
        render();
    }

    function render() {
        const container = document.getElementById('main-content-area');
        const pagination = document.getElementById('main-pagination');
        const activeData = data[currentTab];
        
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const items = activeData.slice(start, end);

        container.innerHTML = items.map(item => `
            <div class="content-row">
                <span class="tag-badge">${item.tag}</span>
                <span class="title-text">${item.title}</span>
                <p class="desc-text">${item.desc}</p>
                ${item.url ? `<a href="${item.url}" target="_blank" class="btn-exec">Review Source Article</a>` : ''}
            </div>
        `).join('');

        // Render Pagination
        const totalPages = Math.ceil(activeData.length / itemsPerPage);
        pagination.innerHTML = '';
        for (let i = 1; i <= totalPages; i++) {
            pagination.innerHTML += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                </li>
            `;
        }
    }

    window.changePage = function(p) {
        currentPage = p;
        render();
        window.scrollTo(0,0);
    };

    // Initial load
    document.addEventListener("DOMContentLoaded", render);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
