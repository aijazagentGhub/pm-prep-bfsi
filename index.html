            { t: "Shopify: Anti-Amazon Moat", b: ["Empowering individual merchants.", "Platform ecosystem of apps/themes.", "10% of US e-commerce."], tag: "E-Commerce", url: "https://www.shopify.com/in/about" },
            { t: "Uber: Surge Pricing", b: ["Economics used to stabilize supply.", "Real-time reliability feature.", "Dynamic pricing leader."], tag: "Economics", url: "https://hbr.org/2015/12/the-logic-of-ubers-surge-pricing" },
            { t: "Revolut: Super-App Strategy", b: ["Forex -> Stocks -> Crypto -> Stays.", "Operating System for money.", "$33B+ valuation."], tag: "Fintech", url: "https://www.revolut.com/en-IN/about/" },
            { t: "Duolingo: Gamified Growth", b: ["Streak counters driving retention.", "Psychology-led habit formation.", "Leader in EdTech MAU."], tag: "EdTech", url: "https://www.duolingo.com/about" },
            { t: "Disney+: The Bundle Move", b: ["Hulu/ESPN/Disney for churn defense.", "100M+ users in record time.", "Media moat strategy."], tag: "Media", url: "https://disneyplus.com" }
        ]
    };

    function loadTab(k) {
        activeTab = k; activePage = 1;
        document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('active', n.getAttribute('onclick').includes(k)));
        render();
    }

    function render() {
        const grid = document.getElementById('gridArea');
        const nav = document.getElementById('pages');
        const set = DATA[activeTab];
        const items = set.slice((activePage - 1) * PAGE_SIZE, activePage * PAGE_SIZE);

        grid.innerHTML = items.map(item => `
            <div class="entry-card shadow-sm">
                <div class="entry-title">${item.t}</div>
                <div class="entry-body"><ul>${item.b.map(pt => `<li>${pt}</li>`).join('')}</ul></div>
                <div class="entry-footer">
                    <span class="tag">${item.tag}</span>
                    <a href="${item.url}" target="_blank" class="source-link">Read Source →</a>
                </div>
            </div>
        `).join('');

        const total = Math.ceil(set.length / PAGE_SIZE);
        nav.innerHTML = '';
        for (let i = 1; i <= total; i++) {
            nav.innerHTML += `<li class="page-item ${i === activePage ? 'active' : ''}"><a class="page-link" href="#" onclick="setPage(${i})">${i}</a></li>`;
        }
    }

    window.setPage = (p) => { activePage = p; render(); window.scrollTo(0,0); };
    document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
