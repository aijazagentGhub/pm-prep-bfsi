<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior PM Strategy Hub - Verified Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --slate-900: #0f172a; --slate-100: #f1f5f9; }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #334155; }
        .container-fluid { max-width: 1600px; padding: 20px; }
        .hub-shell { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 25px; min-height: 92vh; }
        .nav-pills { background: var(--slate-100); padding: 6px; border-radius: 10px; margin-bottom: 25px; gap: 4px; }
        .nav-pills .nav-link { font-weight: 700; color: #64748b; border: 1px solid transparent; flex: 1; text-align: center; border-radius: 8px; font-size: 0.9rem; }
        .nav-pills .nav-link.active { background: white; color: var(--primary); border-color: #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .content-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .card-item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; background: #fff; min-height: 220px; display: flex; flex-direction: column; }
        .card-header-text { font-weight: 800; font-size: 1.05rem; color: var(--slate-900); margin-bottom: 10px; line-height: 1.4; }
        .card-body-points { font-size: 0.88rem; line-height: 1.6; color: #475569; flex-grow: 1; }
        .card-body-points ul { padding-left: 1.2rem; margin: 0; }
        .card-footer-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
        .type-tag { font-size: 0.65rem; font-weight: 800; color: var(--primary); background: #eff6ff; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .link-ref { font-size: 0.72rem; font-weight: 700; color: #3b82f6; text-decoration: none; }
        .link-ref:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="hub-shell">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">Senior Product Strategy Hub</h3>
            <span class="badge bg-primary px-3 py-2">MANUAL INDUSTRY SYNC</span>
        </div>
        <ul class="nav nav-pills" id="tabSet">
            <li class="nav-item"><button class="nav-link active" onclick="loadTab('foundations')">Foundations & Metrics</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('qa')">Leadership Q&A</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('cases')">Success Cases</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('glossary')">Strategy Terms</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('articles')">Industry Reads</button></li>
        </ul>
        <div id="displayGrid" class="content-grid"></div>
        <nav class="d-flex justify-content-center mt-4"><ul class="pagination" id="pageNav"></ul></nav>
    </div>
</div>

<script>
    const PAGE_SIZE = 14;
    let currentKey = 'foundations';
    let currentPage = 1;

    // DATA SOURCED DIRECTLY FROM INDUSTRY LEADERS (INDEED, EXPONENT, PRODUCTPLAN, MCKINSEY)
    const DATA = {
        foundations: [
            { t: "Customer Acquisition Cost (CAC)", b: ["Leading indicator of competitive strength and messaging fit.", "Includes direct ad spend + indirect salaries/sales commissions.", "Formula: Total S&M Costs / New Customers."], tag: "Metric", url: "https://www.productplan.com/learn/metrics-product-should-know/" },
            { t: "Trial to Paid Conversion", b: ["Direct reflection of the product's actual value delivery.", "A falling rate signals a disconnect between promise and reality.", "Key for B2B/SaaS with long sales cycles."], tag: "Metric", url: "https://www.productplan.com/learn/metrics-product-should-know/" },
            { t: "Feature Adoption Rate", b: ["Tracks which part of functionality draws and keeps users.", "Used to reprioritize the roadmap based on usage data.", "Essential for validating 'Activation' in new features."], tag: "Metric", url: "https://www.productplan.com/learn/metrics-product-should-know/" },
            { t: "Customer Lifetime Value (CLV/LTV)", b: ["Total revenue expected from a customer before they churn.", "Can be increased via upselling, cross-selling, and referral.", "Formula: Avg Life of Customer * Value of Customer."], tag: "Metric", url: "https://www.dezkr.com/blog/product-management-metrics/" },
            { t: "Net Promoter Score (NPS)", b: ["Measures likelihood of recommendation on a scale of 0-10.", "Promoters (9-10) minus Detractors (0-6).", "Used as a proxy for customer satisfaction and word-of-mouth growth."], tag: "Metric", url: "https://www.dezkr.com/blog/product-management-metrics/" },
            { t: "Monthly Active Users (MAU/DAU)", b: ["Measures stickiness and habitual usage of the product.", "Ratio (DAU/MAU) shows the 'habit' strength.", "Essential for Gen Z and social-led discovery apps."], tag: "Metric", url: "https://www.talaera.com/grammar-and-vocabulary/product-management-terms/" }
        ],
        qa: [
            { t: "What are a senior PM's core responsibilities?", b: ["Overseeing product decisions from initiation to termination.", "Aligning design concepts with financial firm performance.", "Helping clients meet customer needs through targeted marketing."], tag: "Indeed", url: "https://uk.indeed.com/career-advice/interviewing/senior-product-manager-interview-questions" },
            { t: "Explain the soft skills required for Senior PMs.", b: ["Problem-solving, leadership, and time management.", "Negotiation skills to secure favorable vendor supply contracts.", "Flexibility to manage entire lifecycles across departments."], tag: "Indeed", url: "https://uk.indeed.com/career-advice/interviewing/senior-product-manager-interview-questions" },
            { t: "When have you made short-term sacrifices for long-term gains?", b: ["Tests cross-functional collaboration and stakeholder management.", "Assess attitude and behavior during difficult strategic trade-offs.", "Focus on behavioral storytelling (STAR method)."], tag: "Exponent", url: "https://www.tryexponent.com/blog/top-product-manager-interview-questions" },
            { t: "How would you react to a competing product?", b: ["Tests ability to think competitively in an evolving market.", "Focus on setting goals and developing a differentiated strategy.", "Don't just copy—evaluate market gaps and user needs."], tag: "Exponent", url: "https://www.tryexponent.com/blog/top-product-manager-interview-questions" }
        ],
        cases: [
            { t: "Improve user engagement for Google Maps among Gen Z.", b: ["Focus on 'aesthetic-driven discovery' and social interaction.", "Propose influencer-curated maps and collaborative trip planning.", "Success measured by session length and lift in shared lists."], tag: "Growth", url: "https://www.joinleland.com/library/a/product-management-case-study-interviews-the-ultimate-guide" },
            { t: "Create a pricing strategy for YouTube in emerging markets.", b: ["Consider price sensitivity and local payment infrastructure.", "Propose mobile-only $1/month plans to drive adoption.", "Measure success via trial-to-paid conversion in target regions."], tag: "Pricing", url: "https://www.joinleland.com/library/a/product-management-case-study-interviews-the-ultimate-guide" },
            { t: "Scaling product delivery at Ricoh.", b: ["Challenge: Maintaining visibility across global organization.", "Solution: Standardizing tools to drive productivity from ideation to roadmap.", "Result: Increased confidence in taking bold strategic steps."], tag: "Ops", url: "https://airfocus.com/blog/7-product-management-case-studies-to-live-and-learn-by/" }
        ],
        glossary: [
            { t: "TAM, SAM, SOM", b: ["TAM: Total revenue opportunity at 100% market share.", "SAM: Serviceable market your product can actually serve.", "SOM: Serviceable Obtainable market realistically captured in 1-3 years."], tag: "Finance", url: "https://www.talaera.com/grammar-and-vocabulary/product-management-terms/" },
            { t: "Strategic Themes", b: ["Portfolio-level business objectives providing differentiation.", "Examples: Platform reliability, enterprise parity, international expansion.", "Connects tactical decisions to enterprise-level strategy."], tag: "Strategy", url: "https://www.talaera.com/grammar-and-vocabulary/product-management-terms/" },
            { t: "Cost of Delay (CoD)", b: ["Quantifies the financial impact of postponing a launch.", "Used to weigh economic value against time delay for prioritization.", "Essential for 10yr+ stakeholder management."], tag: "Ops", url: "https://gocious.com/blog/your-comprehensive-product-management-glossary" }
        ],
        articles: [
            { t: "PM Trends 2026: From Features to Revenue", b: ["Product leaders are being brought into deeper revenue talks.", "Outcome-based metrics are replacing output metrics (shipping count).", "Companies live or die by digital product strength."], tag: "Airtable", url: "https://www.airtable.com/articles/product-management-trends" },
            { t: "The End of Fixed Roadmaps", b: ["Speed and AI prototypes are replacing months-long drafting.", "Focus on product OKRs, principles, and tiny empowered squads.", "Outcome-based roadmaps are revisited constantly vs quarterly."], tag: "School", url: "https://productschool.com/blog/product-fundamentals/product-management-trends" }
        ]
    };

    function loadTab(k) {
        currentKey = k; currentPage = 1;
        document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('active', n.getAttribute('onclick').includes(k)));
        render();
    }

    function render() {
        const grid = document.getElementById('displayGrid');
        const nav = document.getElementById('pageNav');
        const dataSet = DATA[currentKey];
        const items = dataSet.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

        grid.innerHTML = items.map(item => `
            <div class="card-item shadow-sm">
                <div class="card-header-text">${item.t}</div>
                <div class="card-body-points"><ul>${item.b.map(pt => `<li>${pt}</li>`).join('')}</ul></div>
                <div class="card-footer-meta">
                    <span class="type-tag">${item.tag}</span>
                    <a href="${item.url}" target="_blank" class="link-ref">Full Article →</a>
                </div>
            </div>
        `).join('');

        const total = Math.ceil(dataSet.length / PAGE_SIZE);
        nav.innerHTML = '';
        for (let i = 1; i <= total; i++) {
            nav.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="setPage(${i})">${i}</a></li>`;
        }
    }

    window.setPage = (p) => { currentPage = p; render(); window.scrollTo(0,0); };
    document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
