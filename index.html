<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Strategy Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: -apple-system, system-ui, sans-serif; padding: 10px; }
        
        /* Mobile-First Adjustments */
        .vault-card { background: white; border-radius: 12px; padding: 15px; min-height: 95vh; }
        
        /* Horizontal scroll for tabs on mobile */
        .nav-pills { 
            display: flex; 
            flex-wrap: nowrap; 
            overflow-x: auto; 
            background: #f1f5f9; 
            padding: 5px; 
            border-radius: 10px; 
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }
        .nav-pills .nav-item { flex: 0 0 auto; }
        .nav-pills .nav-link { white-space: nowrap; font-size: 0.85rem; font-weight: 600; color: #64748b; }
        .nav-pills .nav-link.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Responsive Grid */
        .content-grid { 
            display: grid; 
            grid-template-columns: 1fr; /* Single column for mobile */
            gap: 15px; 
        }
        @media (min-width: 768px) {
            .content-grid { grid-template-columns: 1fr 1fr; } /* 2 columns for desktop */
        }

        .entry-card { 
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            padding: 18px; 
            display: flex; 
            flex-direction: column; 
            height: 100%;
        }
        .entry-title { font-weight: 800; font-size: 1.05rem; color: #0f172a; margin-bottom: 8px; }
        .entry-body { font-size: 0.9rem; line-height: 1.5; color: #475569; flex-grow: 1; }
        .entry-body ul { padding-left: 1.2rem; margin-bottom: 0; }
        
        .entry-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 15px; 
            padding-top: 10px; 
            border-top: 1px solid #f1f5f9; 
        }
        .tag { font-size: 0.65rem; font-weight: 700; color: var(--primary); background: #eff6ff; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .source-link { font-size: 0.75rem; font-weight: 700; color: #2563eb; text-decoration: none; border: 1px solid #dbeafe; padding: 4px 10px; border-radius: 6px; }

        .pagination .page-link { border-radius: 5px; margin: 0 2px; font-size: 0.85rem; }
    </style>
</head>
<body>

    function loadTab(k) {
        activeTab = k; activePage = 1;
        document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('active', n.getAttribute('onclick').includes(k)));
        render();
    }

    function render() {
        const grid = document.getElementById('gridArea');
        const nav = document.getElementById('pages');
        const set = DATA[activeTab];
        const items = set.slice((activePage - 1) * PAGE_SIZE, activePage * PAGE_SIZE);

        grid.innerHTML = items.map(item => `
            <div class="entry-card shadow-sm">
                <div class="entry-title">${item.t}</div>
                <div class="entry-body"><ul>${item.b.map(pt => `<li>${pt}</li>`).join('')}</ul></div>
                <div class="entry-footer">
                    <span class="tag">${item.tag}</span>
                    <a href="${item.url}" target="_blank" class="source-link">Read →</a>
                </div>
            </div>
        `).join('');

        const total = Math.ceil(set.length / PAGE_SIZE);
        nav.innerHTML = '';
        for (let i = 1; i <= total; i++) {
            nav.innerHTML += `<li class="page-item ${i === activePage ? 'active' : ''}"><a class="page-link" href="#" onclick="setPage(${i})">${i}</a></li>`;
        }
    }

    window.setPage = (p) => { activePage = p; render(); window.scrollTo(0,0); };
    document.addEventListener("DOMContentLoaded", render);
