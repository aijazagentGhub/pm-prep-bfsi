            { t: "Apple: Services Shift", b: ["Hardware to recurring high-margin subs.", "iCloud/Music/Store ecosystem.", "Sustainable long-term growth."], tag: "Strategy", url: "https://www.apple.com/in/newsroom/" },

        ]
    };

    function loadTab(k) {
        activeTab = k; activePage = 1;
        document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('active', n.getAttribute('onclick').includes(k)));
        render();
    }

    function render() {
        const grid = document.getElementById('gridArea');
        const nav = document.getElementById('pages');
        const set = DATA[activeTab];
        const items = set.slice((activePage - 1) * PAGE_SIZE, activePage * PAGE_SIZE);

        grid.innerHTML = items.map(item => `
            <div class="entry-card shadow-sm">
                <div class="entry-title">${item.t}</div>
                <div class="entry-body"><ul>${item.b.map(pt => `<li>${pt}</li>`).join('')}</ul></div>
                <div class="entry-footer">
                    <span class="tag">${item.tag}</span>
                    <a href="${item.url}" target="_blank" class="source-link">Read Source →</a>
                </div>
            </div>
        `).join('');

        const total = Math.ceil(set.length / PAGE_SIZE);
        nav.innerHTML = '';
        for (let i = 1; i <= total; i++) {
            nav.innerHTML += `<li class="page-item ${i === activePage ? 'active' : ''}"><a class="page-link" href="#" onclick="setPage(${i})">${i}</a></li>`;
        }
    }

    window.setPage = (p) => { activePage = p; render(); window.scrollTo(0,0); };
    document.addEventListener("DOMContentLoaded", render);
</script>
</body>
