<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior PM Strategy Hub - Final Build</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --slate-900: #0f172a; --slate-100: #f1f5f9; }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #334155; }
        .container-fluid { max-width: 1600px; padding: 20px; }
        .hub-shell { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 25px; min-height: 92vh; }
        .nav-pills { background: var(--slate-100); padding: 6px; border-radius: 10px; margin-bottom: 25px; gap: 4px; }
        .nav-pills .nav-link { font-weight: 700; color: #64748b; border: 1px solid transparent; flex: 1; text-align: center; border-radius: 8px; font-size: 0.9rem; }
        .nav-pills .nav-link.active { background: white; color: var(--primary); border-color: #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .content-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .card-item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; background: #fff; min-height: 200px; display: flex; flex-direction: column; }
        .card-header-text { font-weight: 800; font-size: 1.05rem; color: var(--slate-900); margin-bottom: 10px; line-height: 1.4; }
        .card-body-points { font-size: 0.88rem; line-height: 1.6; color: #475569; flex-grow: 1; }
        .card-body-points ul { padding-left: 1.2rem; margin: 0; }
        .card-footer-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
        .type-tag { font-size: 0.65rem; font-weight: 800; color: var(--primary); background: #eff6ff; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .link-ref { font-size: 0.72rem; font-weight: 700; color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="hub-shell">
        <h3 class="fw-bold mb-4">Senior Product Leadership Hub</h3>
        <ul class="nav nav-pills" id="tabSet">
            <li class="nav-item"><button class="nav-link active" onclick="loadTab('foundations')">PM Foundations</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('qa')">Leadership Q&A</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('cases')">Success Cases</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('glossary')">Strategy Terms</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('articles')">Industry Reads</button></li>
        </ul>
        <div id="displayGrid" class="content-grid"></div>
        <nav class="d-flex justify-content-center mt-4"><ul class="pagination" id="pageNav"></ul></nav>
    </div>
</div>

<script>
    const PAGE_SIZE = 6; // Set to 6 to demonstrate pagination clearly with 10+ entries
    let currentKey = 'foundations';
    let currentPage = 1;

    const DATA = {
        foundations: [
            { t: "LTV/CAC Ratio", b: ["Standard for SaaS viability.", "Target is 3x Lifetime Value over Acquisition Cost.", "Essential for senior-level growth strategy."], tag: "Metric", url: "https://www.reforge.com" },
            { t: "Voluntary vs. Involuntary Churn", b: ["Voluntary is a value-prop failure.", "Involuntary is a technical/payment ops failure.", "Senior PMs must audit both streams."], tag: "Retention", url: "https://amplitude.com" },
            { t: "Net Interest Margin (NIM) - Fintech", b: ["Core for BFSI product leaders.", "Difference between interest income and interest paid.", "Impacts how products are priced in banking."], tag: "Fintech", url: "https://www.investopedia.com" },
            { t: "North Star Metric (NSM)", b: ["Leading indicator of customer value delivery.", "Example: Airbnb is 'Nights Booked'.", "Must correlate directly to long-term revenue."], tag: "Strategy", url: "https://amplitude.com" },
            { t: "Conversion Funnel Activation", b: ["The 'Aha' moment where a user sees value.", "Measured as X actions in Y days.", "Senior PMs optimize the first 48 hours."], tag: "Growth", url: "https://mixpanel.com" },
            { t: "Gross Margin per User", b: ["Revenue minus direct COGS per customer.", "Crucial for path-to-profitability discussions.", "Focus of 2026 'Efficiency' era."], tag: "Finance", url: "https://hbr.org" },
            { t: "TAM/SAM/SOM", b: ["Total, Serviceable, and Obtainable Market.", "Used for board-level sizing of new features.", "Realistically defines the ceiling for a product."], tag: "Strategy", url: "https://www.investopedia.com" },
            { t: "Unit Economics", b: ["Direct revenue vs cost at the individual unit level.", "Scaling only works if unit economics are positive.", "Key for 8-10yr PM management roles."], tag: "Business", url: "https://www.reforge.com" },
            { t: "Active User Habit Strength", b: ["Measured by DAU/MAU ratio.", "Indicates if the product is a daily necessity.", "Target varies by category (e.g., higher for Social/Finance)."], tag: "Metric", url: "https://mixpanel.com" },
            { t: "Burn Multiple", b: ["How much venture cash is spent per dollar of ARR.", "Efficiency metric for late-stage startups.", "Critical context for Senior PMs in tech."], tag: "Finance", url: "https://a16z.com" }
        ],
        qa: [
            { t: "How to handle a pivot mid-sprint?", b: ["Focus on the 'Opportunity Cost' of staying the course.", "Present the data-backed 'Why' to the engineers.", "Recalibrate the roadmap to reflect the new North Star."], tag: "Leadership", url: "https://tryexponent.com" },
            { t: "When do you say 'No' to a major stakeholder?", b: ["Acknowledge their goal, but show the trade-off.", "Use a RICE score or weighted scoring matrix.", "Suggest a low-cost experiment to test their hypothesis."], tag: "Influence", url: "https://www.svpg.com" },
            { t: "Managing Underperforming Senior ICs", b: ["Identify if it is a 'Will' or 'Skill' problem.", "Set clear, measurable Outcome-based OKRs.", "Provide direct, radical candor feedback early."], tag: "Management", url: "https://hbr.org" },
            { t: "Strategy for Competitor Feature Parity", b: ["Assess if the feature is a 'Table Stake' or 'Delighter'.", "Don't copy blindly; evaluate the underlying user need.", "Focus on your unique 'Unfair Advantage'."], tag: "Strategy", url: "https://tryexponent.com" },
            { t: "The First 30 Days as a Senior PM", b: ["Spend 80% of time listening to customers and engineering.", "Identify low-hanging fruit for quick wins.", "Draft a 'State of the Product' document for leadership."], tag: "Career", url: "https://www.lennysnewsletter.com" },
            { t: "Explain Unit Economics to a non-technical CEO", b: ["Break it down to the 'Lemonade Stand' level.", "Focus on the margin after every single sale.", "Link it to the long-term sustainability of the firm."], tag: "Communication", url: "https://www.reforge.com" },
            { t: "Handling an Outage as a Product Lead", b: ["Communicate clearly to stakeholders about the impact.", "Prioritize customer trust over new feature shipping.", "Conduct a blameless post-mortem focused on process."], tag: "Execution", url: "https://www.svpg.com" },
            { t: "Prioritizing UX Debt vs Business Asks", b: ["Quantify how UX friction impacts the conversion funnel.", "Link debt to higher support ticket volume and costs.", "Reserve a fixed % of sprint capacity for refactoring."], tag: "Tactics", url: "https://www.nngroup.com" },
            { t: "Leading 0-to-1 Product Initiatives", b: ["Focus on 'Minimum Viable Value' over 'Features'.", "Aggressively test assumptions through prototyping.", "Expect many failures before finding PMF."], tag: "Innovation", url: "https://www.ycombinator.com" },
            { t: "The Role of AI in Senior PM Workflows", b: ["Shift from manual documentation to automated insights.", "Focus more on ethical implications and data privacy.", "Use AI for rapid experimentation and simulation."], tag: "Future", url: "https://www.mckinsey.com" }
        ],
        cases: [
            { t: "DBS Bank: The GANDALF Transformation", b: ["The blueprint for traditional bank-to-tech company shift.", "Decoupled monolithic architecture to drive agility.", "Shifted culture to data-first decision making."], tag: "Fintech", url: "https://www.dbs.com/innovation/dbs-gandalf.html" },
            { t: "Nubank: Growth without Marketing Spend", b: ["Built a referral-heavy flywheel in Brazil.", "Focused on the 'Underbanked' segment with mobile-first UX.", "Used low CAC to reinvest in better product terms."], tag: "Growth", url: "https://nubank.com.br/en/about/" },
            { t: "Wise (TransferWise): Transparency Moat", b: ["Won market share by exposing hidden bank fees.", "Radical transparency used as a primary marketing tool.", "Built infrastructure to bypass SWIFT for lower costs."], tag: "Strategy", url: "https://wise.com/gb/blog/the-wise-story" },
            { t: "Netflix: Moving to Original Content", b: ["Shifted from a platform to a creator to avoid licensing wars.", "Used viewing data to 'Greenlight' shows with high confidence.", "Demonstrated the power of vertical integration."], tag: "Pivot", url: "https://hbr.org" },
            { t: "Stripe: API-as-a-Product", b: ["Proved that developers are key financial decision makers.", "Simplified complex payments into a single documentation page.", "Built a massive ecosystem through platform play."], tag: "B2B", url: "https://stripe.com/blog" },
            { t: "Klarna: GenAI for Customer Service", b: ["Replaced hundreds of support agents with AI bots.", "Improved resolution time while lowering operating costs.", "Case study for the 'Agentic Workflow' in BFSI."], tag: "Innovation", url: "https://www.klarna.com/international/press/" },
            { t: "Robinhood: Democratizing Finance", b: ["Used zero-commission trading to disrupt incumbents.", "Gamified the interface to drive engagement (controversial).", "Shifted the industry toward no-fee trading models."], tag: "Disruption", url: "https://robinhood.com" },
            { t: "Airbnb: The Move to 'Experiences'", b: ["Leveraged host trust to expand into tour booking.", "Used existing app traffic to cross-sell new verticals.", "Faced the challenge of inconsistent supply quality."], tag: "Expansion", url: "https://news.airbnb.com" },
            { t: "Spotify: The 'Squad' Model", b: ["A case study on organizational scaling for speed.", "Autonomous teams owning end-to-end features.", "Balancing alignment with extreme autonomy."], tag: "Org Design", url: "https://engineering.atspotify.com" },
            { t: "Uber: Surge Pricing Algorithm", b: ["Classic case of balancing supply/demand via economics.", "Dynamic pricing used to ensure platform reliability.", "Faced public perception vs operational necessity trade-offs."], tag: "Pricing", url: "https://www.uber.com/blog/" }
        ],
        glossary: [
            { t: "MECE Framework", b: ["Mutually Exclusive, Collectively Exhaustive.", "The standard for problem-solving in management consulting.", "Ensures no logical gaps in strategy documents."], tag: "Logic", url: "https://www.mckinsey.com" },
            { t: "Cost of Delay", b: ["The economic impact of not shipping a feature today.", "Helps prioritize high-value work over 'loud' requests.", "Key for 8-10yr roadmap management."], tag: "Ops", url: "https://www.blackswan-iv.com" },
            { t: "Product-Market Fit (PMF)", b: ["The moment market demand matches product supply.", "Measured via the 'Sean Ellis' 40% rule.", "Foundational for deciding when to scale."], tag: "Foundational", url: "https://growthhackers.com" }
        ],
        articles: [
            { t: "Marty Cagan: The Empowered CPO", b: ["Difference between feature factories and product teams.", "Leadership must provide context, not instructions.", "CPO's role is to ensure the team is solving problems."], tag: "Culture", url: "https://www.svpg.com" },
            { t: "State of BFSI 2026: The AI Bank", b: ["Why retail banking is moving toward 'Invisible' finance.", "Hyper-personalization at the individual user level.", "The end of traditional bank branches."], tag: "Trends", url: "https://www.mckinsey.com" }
        ]
    };

    function loadTab(k) {
        currentKey = k; currentPage = 1;
        document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('active', n.getAttribute('onclick').includes(k)));
        render();
    }

    function render() {
        const grid = document.getElementById('displayGrid');
        const nav = document.getElementById('pageNav');
        const dataSet = DATA[currentKey];
        const items = dataSet.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

        grid.innerHTML = items.map(item => `
            <div class="card-item shadow-sm">
                <div class="card-header-text">${item.t}</div>
                <div class="card-body-points"><ul>${item.b.map(pt => `<li>${pt}</li>`).join('')}</ul></div>
                <div class="card-footer-meta">
                    <span class="type-tag">${item.tag}</span>
                    <a href="${item.url}" target="_blank" class="link-ref">Source Ref →</a>
                </div>
            </div>
        `).join('');

        const total = Math.ceil(dataSet.length / PAGE_SIZE);
        nav.innerHTML = '';
        if(total > 1) {
            for (let i = 1; i <= total; i++) {
                nav.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="setPage(${i})">${i}</a></li>`;
            }
        }
    }

    window.setPage = (p) => { currentPage = p; render(); window.scrollTo(0,0); };
    document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
