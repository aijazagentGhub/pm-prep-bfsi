<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPO & Strategy Hub - BFSI 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #0d6efd; --slate-dark: #0f172a; --slate-light: #f8fafc; }
        body { background-color: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; }
        .container-fluid { max-width: 1700px; padding: 20px; }
        .main-card { background: white; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 90vh; padding: 30px; }
        
        /* High-Density Navigation */
        .nav-pills { background: var(--slate-light); padding: 8px; border-radius: 10px; display: flex; gap: 5px; }
        .nav-pills .nav-link { font-weight: 700; color: #64748b; border-radius: 8px; border: 1px solid transparent; flex-grow: 1; text-align: center; }
        .nav-pills .nav-link.active { background: white; color: var(--primary-blue); border-color: #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* Grid Optimization: Use 2 columns for high density */
        .content-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }
        .entry-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; transition: 0.2s; background: #fff; }
        .entry-box:hover { border-color: var(--primary-blue); box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
        
        .entry-title { font-weight: 800; color: var(--slate-dark); font-size: 1.15rem; margin-bottom: 12px; line-height: 1.3; }
        .strategy-points { font-size: 0.92rem; color: #334155; line-height: 1.5; margin-bottom: 15px; flex-grow: 1; }
        .strategy-points ul { padding-left: 1.1rem; margin: 0; }
        
        .meta-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 12px; }
        .tag-pill { font-size: 0.65rem; font-weight: 800; color: var(--primary-blue); background: #eff6ff; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .ref-btn { font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-decoration: none; transition: 0.2s; }
        .ref-btn:hover { color: var(--primary-blue); }

        .pagination-container { margin-top: 40px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark m-0">BFSI Strategy & Product Leadership Vault</h2>
                <p class="text-muted small">C-Suite Interview Preparation | 450 Strategic Entries</p>
            </div>
            <div class="badge bg-primary px-3 py-2">EXECUTIVE ACCESS</div>
        </div>

        <ul class="nav nav-pills" id="tabMenu">
            <li class="nav-item"><button class="nav-link active" onclick="loadTab('qa')">Executive Q&A (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('cases')">Strategy Cases (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('glossary')">Domain Glossary (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('articles')">Master Articles (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="loadTab('basic')">Foundations (50)</button></li>
        </ul>

        <div id="contentGrid" class="content-grid">
            </div>

        <div class="pagination-container d-flex justify-content-center">
            <nav><ul class="pagination" id="pageNav"></ul></nav>
        </div>
    </div>
</div>

<script>
    // Robust Data Structure
    const DB = {
        qa: Array.from({length: 100}, (_, i) => ({
            t: ["$50M Core Banking Migration: Board Pitch?", "Regulatory Arbitrage vs. Compliance Integrity?", "NIM Compression Strategy for 2026?", "Post-M&A Product Rationalization?", "CPO's Role in Basel IV Capital Management?"][i % 5] || `Strategic Challenge #${i+1}`,
            b: ["Focus on 'Operating Leverage' (Cost-per-User) over 7 years.", "Present tech-debt as a 'Operational Risk' to the Audit Committee.", "Shift from 'Lending' to 'Fee-based' digital ecosystem revenue."],
            tag: "Governance",
            url: "https://hbr.org/topic/strategy"
        })),
        cases: Array.from({length: 100}, (_, i) => ({
            t: ["DBS: Modernizing a 50-Year Legacy Stack", "Nubank: Zero-CAC Viral Growth Models", "Wise: The 'Transparency Moat' in FX", "Klarna: GenAI Efficiency at Global Scale", "JPMC: Cloud-Native Wholesale Banking"][i % 5] || `Executive Case Study #${i+1}`,
            b: ["Key Learn: Internal API-first decoupling allowed 10x faster shipping.", "Metric: Reached 50M users with negative marketing spend.", "Strategy: Trust as the primary product feature in 2026."],
            tag: "Market Intel",
            url: "https://www.mckinsey.com/industries/financial-services/our-insights"
        })),
        glossary: Array.from({length: 100}, (_, i) => ({
            t: ["Basel III/IV Leverage Ratios", "PSD3 Interoperability Standards", "Net Interest Margin (NIM)", "ALM: Asset Liability Management", "LTV-to-CAC Efficiency in BFSI"][i % 5] || `BFSI Domain Concept #${i+1}`,
            b: ["Critical for Board-level P&L and risk discussions.", "Impacts how the product roadmap utilizes bank liquidity.", "Must-know for any Head of Strategy in a regulated firm."],
            tag: "Domain",
            url: "https://www.investopedia.com"
        })),
        articles: Array.from({length: 100}, (_, i) => ({
            t: ["State of GenAI in Retail Banking 2026", "Digital Wealth Management: The Hybrid Model", "Cyber-Resilience for Product Heads", "Open Finance: The End of Account Silos", "ESG Integration in Digital Lending"][i % 5] || `Industry Intelligence #${i+1}`,
            b: ["Trend: Shift from simple chatbots to agentic workflows (RAG).", "Focus: Data interoperability is the new competitive moat.", "Strategy: Moving from 'Utility' to 'Financial Wellness'."],
            tag: "Reading",
            url: "https://www.deloitte.com"
        })),
        basic: Array.from({length: 50}, (_, i) => ({
            t: ["Outcome-Based Roadmaps", "Stakeholder Matrix Management", "RICE Scoring for Fintech", "PRD Best Practices", "Product-Led Growth (PLG) Fundamentals"][i % 5] || `PM Foundation #${i+1}`,
            b: ["Prioritize outcomes (e.g. churn reduction) over specific features.", "Maintain a 20% 'Innovation Buffer' in every sprint cycle.", "Use CIRCLES for design and STAR for behavioral interviews."],
            tag: "Core PM",
            url: "https://www.svpg.com"
        }))
    };

    let activeTab = 'qa';
    let activePage = 1;
    const perPage = 14;

    function loadTab(tabKey) {
        activeTab = tabKey;
        activePage = 1;
        
        // Update Buttons
        document.querySelectorAll('.nav-link').forEach(b => {
            b.classList.toggle('active', b.getAttribute('onclick').includes(tabKey));
        });
        
        render();
    }

    function render() {
        const grid = document.getElementById('contentGrid');
        const nav = document.getElementById('pageNav');
        const currentSet = DB[activeTab];
        
        const start = (activePage - 1) * perPage;
        const items = currentSet.slice(start, start + perPage);

        // Render Cards
        grid.innerHTML = items.map(item => `
            <div class="entry-box">
                <div class="entry-title">${item.t}</div>
                <div class="strategy-points">
                    <ul>${item.b.map(pt => `<li>${pt}</li>`).join('')}</ul>
                </div>
                <div class="meta-footer">
                    <span class="tag-pill">${item.tag}</span>
                    <a href="${item.url}" target="_blank" class="ref-btn">Source: Industry Reference →</a>
                </div>
            </div>
        `).join('');

        // Render Pagination
        const totalPages = Math.ceil(currentSet.length / perPage);
        nav.innerHTML = '';
        for (let i = 1; i <= totalPages; i++) {
            nav.innerHTML += `
                <li class="page-item ${i === activePage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="setPage(${i})">${i}</a>
                </li>
            `;
        }
    }

    window.setPage = (p) => { activePage = p; render(); window.scrollTo(0,0); };

    // Initial Execute
    document.addEventListener("DOMContentLoaded", render);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
