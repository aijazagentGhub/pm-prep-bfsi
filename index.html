<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Product Leadership Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); }
        .container-fluid { max-width: 1600px; padding: 25px; }
        .hub-card { background: white; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.05); padding: 30px; min-height: 90vh; }
        
        /* Layout Optimization */
        .nav-pills { background: #f1f5f9; padding: 6px; border-radius: 10px; margin-bottom: 25px; }
        .nav-pills .nav-link { font-weight: 700; color: #64748b; border-radius: 8px; flex-grow: 1; text-align: center; }
        .nav-pills .nav-link.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        .content-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .info-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; background: #fff; display: flex; flex-direction: column; height: 100%; transition: 0.2s; }
        .info-card:hover { border-color: var(--primary); }
        
        .card-title { font-weight: 800; font-size: 1.1rem; color: #0f172a; margin-bottom: 8px; line-height: 1.4; }
        .card-body-text { font-size: 0.92rem; line-height: 1.5; color: #475569; flex-grow: 1; }
        .card-body-text ul { padding-left: 1.2rem; margin: 0; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
        .badge-type { font-size: 0.65rem; font-weight: 800; color: var(--primary); background: #eff6ff; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .source-link { font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-decoration: none; }
        .source-link:hover { color: var(--primary); }

        .pagination-bar { margin-top: 30px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="hub-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Senior Product Knowledge Hub</h2>
                <p class="text-muted small">Targeted for 8-10 Years Experience | Strategy & Growth focus</p>
            </div>
            <span class="badge bg-primary px-3 py-2">PM LEADERSHIP READY</span>
        </div>

        <ul class="nav nav-pills" id="mainTabs">
            <li class="nav-item"><button class="nav-link active" onclick="setTab('foundations')">PM Foundations (50)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="setTab('qa')">Interview Q&A (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="setTab('cases')">Success Cases (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="setTab('glossary')">Strategy Terms (100)</button></li>
            <li class="nav-item"><button class="nav-link" onclick="setTab('articles')">Growth Articles (100)</button></li>
        </ul>

        <div id="gridArea" class="content-grid">
            </div>

        <div class="pagination-bar d-flex justify-content-center">
            <nav><ul class="pagination" id="pageNav"></ul></nav>
        </div>
    </div>
</div>

<script>
    const ITEMS_PER_PAGE = 14;
    let currentTab = 'foundations';
    let currentPage = 1;

    const DATABASE = {
        foundations: Array.from({length: 50}, (_, i) => ({
            t: ["What is a Product?", "Revenue vs. Profitability", "Customer Lifetime Value (LTV)", "CAC (Customer Acquisition Cost)", "Churn: Voluntary vs. Involuntary", "North Star Metric Framework"][i % 6] || `Core Concept #${i+1}`,
            b: ["The basic 'Job to be Done' for a user.", "How to measure if a feature makes money vs. costs money.", "Predicting the long-term value of a single user."],
            tag: "Core",
            url: "https://www.productplan.com/glossary/"
        })),
        qa: Array.from({length: 100}, (_, i) => ({
            t: ["How do you handle a product that is losing users?", "Strategy for prioritizing tech debt vs. new features?", "How to lead a team through a major pivot?", "Using data to say 'No' to a senior stakeholder.", "Defining success for a feature with no clear revenue."][i % 5] || `Interview Question #${i+1}`,
            b: ["Focus on 'Retention' before trying to acquire more new users.", "Allocate 20% of the roadmap to maintenance to avoid future crashes.", "Be transparent about the 'Why' behind every strategy shift."],
            tag: "Leadership",
            url: "https://tryexponent.com/blog"
        })),
        cases: Array.from({length: 100}, (_, i) => ({
            t: ["How Netflix mastered personalization.", "Airbnb's move into Experiences.", "Stripe's focus on developer-first documentation.", "Spotify's 'Squad' model for execution.", "Amazon's 'Working Backwards' process."][i % 5] || `Growth Case #${i+1}`,
            b: ["Simple UI changes led to a 15% increase in retention.", "Market expansion requires understanding local user pain points.", "Good documentation is a product feature, not an afterthought."],
            tag: "Market Case",
            url: "https://hbr.org"
        })),
        glossary: Array.from({length: 100}, (_, i) => ({
            t: ["Product-Market Fit", "Unit Economics", "Network Effects", "Friction points in UX", "Opportunity Cost in Roadmapping"][i % 5] || `Growth Term #${i+1}`,
            b: ["Knowing when you have a product that people actually need.", "Measuring if each individual user is profitable.", "How the product becomes better as more people use it."],
            tag: "Terminology",
            url: "https://www.investopedia.com"
        })),
        articles: Array.from({length: 100}, (_, i) => ({
            t: ["How to become a Product Leader", "The future of AI in daily apps", "Building a culture of experimentation", "Moving from Tactical to Strategic thinking", "Retention is the new Growth"][i % 5] || `Learning Article #${i+1}`,
            b: ["Focus on outcomes, not just shipping features.", "Experimentation is about learning faster than the competition.", "Strategy is about choosing what NOT to do."],
            tag: "Growth",
            url: "https://www.mckinsey.com"
        }))
    };

    function setTab(key) {
        currentTab = key;
        currentPage = 1;
        document.querySelectorAll('.nav-link').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('onclick').includes(key));
        });
        render();
    }

    function render() {
        const grid = document.getElementById('gridArea');
        const nav = document.getElementById('pageNav');
        const dataSet = DATABASE[currentTab];
        
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const items = dataSet.slice(start, start + ITEMS_PER_PAGE);

        grid.innerHTML = items.map(item => `
            <div class="info-card">
                <div class="card-title">${item.t}</div>
                <div class="card-body-text">
                    <ul>${item.b.map(bullet => `<li>${bullet}</li>`).join('')}</ul>
                </div>
                <div class="card-footer">
                    <span class="badge-type">${item.tag}</span>
                    <a href="${item.url}" target="_blank" class="source-link">Source →</a>
                </div>
            </div>
        `).join('');

        const totalPages = Math.ceil(dataSet.length / ITEMS_PER_PAGE);
        nav.innerHTML = '';
        for (let i = 1; i <= totalPages; i++) {
            nav.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>`;
        }
    }

    window.changePage = (p) => { currentPage = p; render(); window.scrollTo(0,0); };
    document.addEventListener("DOMContentLoaded", render);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
